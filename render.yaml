services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
